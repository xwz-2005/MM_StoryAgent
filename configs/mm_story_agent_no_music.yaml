video_compose:
  cfg: {}
  params:
    audio_codec: mp3
    audio_sample_rate: 16000
    caption:
      color: white
      font: C:/Windows/Fonts/msyh.ttc
      fontsize: 32
      max_length: 50
    fps: 8
