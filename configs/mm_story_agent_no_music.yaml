    guidance_scale: 10.0
    seed: 112536
    style_name: Storybook
  tool: story_diffusion_t2i
speech_generation:
  cfg:
    sample_rate: 16000
  params:
    voice: zh-CN-XiaoxiaoNeural
  tool: edge_tts
