image_generation:
  cfg:
    height: 512
    llm: qwen
    num_turns: 3
    width: 1024
    fast_mode: true
    concurrency: 4
    # 新增可视化配置
    visualization:
      enable_visualization: true
      auto_detect: true
      chart_types: ["bar", "line", "scatter"]
      chart_layout: "bottom"  # bottom, side_by_side, overlay
      generate_interactive: false
  params: {}
  tool: dashscope_image_api
speech_generation:
  cfg:
    sample_rate: 16000
    concurrency: 6
  params:
    voice: zh-CN-XiaoxiaoNeural
  tool: edge_tts
story_dir: generated_stories/example
story_writer:
  cfg:
    max_conv_turns: 3
    num_outline: 1
    temperature: 0.5
    long_text_threshold: 500
  params:
    main_role: 
    scene: 
    story_topic: 
  tool: qa_outline_story_writer
video_compose:
  cfg: {}
  params:
    audio_codec: mp3
    audio_sample_rate: 16000
    compute_audio_energy: false
    caption:
      color: white
      font: C:/Windows/Fonts/msyh.ttc
      fontsize: 32
      max_length: 50
    fps: 8
    height: 512
    slideshow_effect:
      fade_duration: 0.8
      move_ratio: 0.9
      slide_duration: 0.4
      zoom_speed: 0.5
    story_dir: generated_stories/example
    width: 1024
  tool: slideshow_video_compose
