story_writer:
  cfg:
    max_conv_turns: 3
    num_outline: 1
    temperature: 0.5
    long_text_threshold: 500
  params:
    main_role: 
    scene: 
    story_topic: 
    long_text: 巷口的老槐树不知立了多少年，皲裂的树皮像张婆婆脸上堆叠的皱纹，每到初夏就会缀满细碎的白花，风一吹就把清甜的香气揉进巷子里的每一寸空气。张婆婆每天清晨都会搬着竹椅坐在树底下，手里攥着半旧的蒲扇，眼睛望着巷口来来往往的人影，像是在等什么人。这天上午，巷口跑进来个扎着羊角辫的小姑娘，粉白的裙子上沾了泥点，圆圆的脸上挂着泪珠，跑到老槐树下就蹲下来，肩膀一抽一抽地哭。张婆婆放下蒲扇凑过去，枯瘦的手轻轻拍了拍小姑娘的后背，声音像泡过蜜的温水：“丫头，咋啦这是？”小姑娘抬起头，睫毛上还挂着泪珠，吸着鼻子说自己跟妈妈走散了，只记得妈妈说过巷口有棵大槐树。张婆婆赶紧从布兜里摸出块水果糖，剥了糖纸塞进小姑娘嘴里，“别慌，婆婆在这儿陪你等，你妈妈肯定会找来的。”小姑娘含着糖，甜味慢慢驱散了恐慌，她看着张婆婆布满老年斑的手，又看了看老槐树上垂下来的树藤，小声问：“婆婆，这树比你还老吗？”张婆婆笑了，眼角的皱纹挤成一朵花：“它啊，比我奶奶还老呢，我小时候就在这儿爬树掏鸟窝，树枝桠都被我磨得光溜溜的。”说着就指着树干上一块光滑的地方给小姑娘看，那是岁月留下的温软痕迹。两人就这么有一搭没一搭地聊着，张婆婆讲她小时候在槐树下听评书、晒麦子的事，小姑娘说她在幼儿园画的画得了奖，还说要画下这棵开满白花的老槐树。太阳慢慢爬到头顶，槐花的香气更浓了，张婆婆从家里端来凉好的绿豆汤，给小姑娘盛了一碗，小姑娘捧着粗瓷碗，小口小口地喝着，额头上的汗珠被风吹干，露出了圆圆的小酒窝。突然，巷口传来急促的呼喊声，小姑娘一下子站起来，朝着声音的方向挥挥手：“妈妈！我在这儿！”一个穿着连衣裙的女人快步跑过来，看见小姑娘就紧紧抱住，眼眶都红了，转头对张婆婆连连道谢。张婆婆摆摆手：“都是应该的，这孩子乖得很。”女人拉着小姑娘要走，小姑娘却挣开妈妈的手，跑到老槐树下，摘下一朵最饱满的槐花，踮着脚尖递给张婆婆：“婆婆，这个给你，香香的。”张婆婆接过槐花，放在鼻尖闻了闻，香气钻进肺里，像是把整颗心都泡软了。从那以后，小姑娘每天放学都会绕到巷口，给张婆婆带一颗水果糖，有时是草莓味的，有时是橘子味的，张婆婆则会给她留一块刚蒸好的槐花糕，糯叽叽的，带着自然的清甜。有一次，小姑娘看见张婆婆在给老槐树浇水，树干上有一道新的划痕，像是被调皮的孩子用石头划的。小姑娘皱着眉头，从书包里拿出彩笔，在划痕旁边画了个小小的太阳，又画了朵槐花，说：“这样树婆婆就不疼啦。”张婆婆看着树干上歪歪扭扭的图案，笑着笑着就湿了眼眶——她的儿子在外地工作，好几年没回来过，自从老伴走后，她就一个人守着这棵老槐树，日子过得像一碗凉掉的粥，直到这个小姑娘出现，才重新添了几分暖意。转眼到了深秋，老槐树的叶子落了一地，金黄的一片，像铺了层地毯。小姑娘踩着落叶跑过来，手里拿着一张画，画上面是老槐树，树下坐着张婆婆，她自己则举着一朵槐花，旁边还有个小小的身影，小姑娘说：“这是我爸爸，他从外地回来啦，我们明天要来看你和树婆婆。”张婆婆听了，连忙点头，转身就去厨房翻出自己腌的咸菜，那是儿子小时候最爱吃的，她想着明天一起给小姑娘的爸爸带上。第二天一早，张婆婆就把竹椅搬到老槐树下，桌上摆着槐花糕和刚沏好的热茶，还把腌咸菜装在干净的玻璃罐里。不一会儿，巷口就传来了笑声，小姑娘拉着爸爸的手，妈妈跟在旁边，手里还提着一篮水果。男人走上前，恭恭敬敬地给张婆婆鞠了一躬：“阿姨，谢谢您一直照顾我家孩子，我这次回来就不走了，以后有什么事您尽管开口。”张婆婆看着眼前的一家人，又看了看枝繁叶茂的老槐树，阳光透过树枝洒下来，在地上投下斑驳的光影，暖融融的，像极了多年前，她和老伴带着年幼的儿子，在槐树下晒太阳的模样。后来，每到初夏，老槐树下就更热闹了，张婆婆坐在竹椅上，小姑娘和她的弟弟在树下追逐嬉戏，男人则帮着张婆婆修剪树枝，女人在一旁择菜，槐花的香气混着饭菜的香味，飘满了整条巷子，连风都带着暖暖的味道，而那棵老槐树，就像一位沉默的守护者，见证着这巷口的温情，一年又一年，枝繁叶茂，从未凋零。
  tool: qa_outline_story_writer
